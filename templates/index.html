<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emotion Detector</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #16202a;
        --muted: #5d6b7b;
        --accent: #1d9e75;
        --accent-2: #103f91;
        --border: #d8e1ea;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, rgba(16, 63, 145, 0.09), transparent 30%),
          radial-gradient(circle at bottom right, rgba(29, 158, 117, 0.1), transparent 28%),
          var(--bg);
        color: var(--text);
      }

      .shell {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      .hero {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(17, 24, 39, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.08rem;
      }

      .grid {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px 20px;
        background: #fbfdff;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
      }

      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        font-family: inherit;
      }

      .result {
        margin-top: 18px;
        padding: 16px;
        border-left: 4px solid var(--accent);
        background: rgba(29, 158, 117, 0.06);
        min-height: 1.5rem;
        white-space: pre-wrap;
      }

      form {
        display: grid;
        gap: 12px;
      }

      button {
        width: fit-content;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      .hint {
        margin-top: 10px;
        font-size: 0.95rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <h1>Emotion Detector</h1>
        <p>Enter a short statement and evaluate the strongest emotion it expresses.</p>

        <div class="grid">
          <div class="card">
            <form id="emotion-form">
              <label for="textToAnalyze">Text to analyze</label>
              <input id="textToAnalyze" type="text" placeholder="Type something here" />
              <button type="submit">Analyze emotion</button>
            </form>
            <div class="hint">The result area below updates from the Flask route.</div>
          </div>
          <div class="card result" id="result">Ready for input.</div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("emotion-form");
      const input = document.getElementById("textToAnalyze");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const value = input.value.trim();
        const response = await fetch(`/emotionDetector?textToAnalyze=${encodeURIComponent(value)}`);
        result.textContent = await response.text();
      });
    </script>
  </body>
</html>
